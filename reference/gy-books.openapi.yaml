                    code: FORBIDDEN
                    message: The user has no permission to access this resource.
                    status: 403
                    owner: API_GATEWAY
          headers: {}
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error%20Response'
                description: Not Found
              examples:
                '3':
                  summary: Token Not Found
                  value:
                    code: TOKEN_NOT_FOUND
                    message: Authentication token was not found.
                    status: 404
                    owner: API_GATEWAY
                '4':
                  summary: Book Not Found
                  value:
                    code: BOOK_NOT_FOUND
                    message: Book not found.
                    status: 404
                    owner: GYCODING
          headers: {}
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error%20Response'
                description: Internal Error
              examples:
                '5':
                  summary: Database Error
                  value:
                    code: DB_ERROR
                    message: >-
                      An error with the database has occurred, sorry for the
                      inconvenience.
                    status: 500
                    owner: GYCODING
                '6':
                  summary: Auth Error from API Gateway
                  value:
                    code: AUTH_ERROR
                    message: >-
                      An error with the authentication service has occurred,
                      sorry for the inconvenience.
                    status: 500
                    owner: API_GATEWAY
                '7':
                  summary: Gateway Error
                  value:
                    code: GATEWAY_ERROR
                    message: >-
                      An internal API Gateway error has occurred, sorry for the
                      inconvenience.
                    status: 500
                    owner: API_GATEWAY
                '8':
                  summary: Server Error
                  value:
                    code: SERVER_ERROR
                    message: >-
                      An internal server error has occurred, sorry for the
                      inconvenience.
                    status: 500
                    owner: GYCODING
          headers: {}
      security: []
      x-roles:
        - ADMIN
webhooks: {}
components:
  schemas:
    Book:
      type: object
      properties:
        id:
          type: string
          description: Book ID.
        averageRating:
          type: number
          description: Book Avergate Rating.
        userData:
          description: Book read status.
          $ref: '#/components/schemas/Book%20User%20Data'
      required:
        - id
        - averageRating
    Book User Data:
      type: object
      properties:
        profileId:
          type: string
          format: uuid
          description: User Profile ID.
        status:
          type: string
          enum:
            - WANT_TO_READ
            - READING
            - READ
          description: User status regarding this book.
        rating:
          type: number
          maximum: 5
          minimum: 0
          description: User rating for this book.
        progress:
          type: number
          description: User progress on the book.
        startDate:
          type: string
          format: date
          description: When the user has started reading this book.
        endDate:
          type: string
          format: date
          description: When the user has finished reading this book.
        editionId:
          type: string
          description: User favourite edition ID.
        review:
          type: string
          description: User review on the book.
      required:
        - status
        - rating
        - startDate
        - endDate
        - profileId
        - progress
        - editionId
        - review
    Friend Request:
      type: object
      properties:
        id:
          type: string
          description: Friend Request ID.
        from:
          type: string
          description: Profile ID of the user who sent the friend request.
        to:
          type: string
          description: Profile ID of the user who receives the friend request.
      description: Friend Request Object.
      required:
        - id
        - from
        - to
    User Profile:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Profile ID.
        username:
          type: string
          description: User username.
        phoneNumber:
          type: string
          description: User phone number.
          pattern: ^\+\d{1,3}\s\d{4,14}$
        picture:
          type: string
          format: uri
          description: User profile picture.
        email:
          type: string
          format: email
          description: User email.
        isFriend:
          type: boolean
          description: Whether user is friend or not of the user requesting.
        biography:
          type: string
          description: User biography for GY Books.
        hallOfFame:
          $ref: '#/components/schemas/Hall%20of%20Fame'
          description: Hall of Fame.
        activity:
          type: array
          items:
            $ref: '#/components/schemas/Activity'
            description: Activity.
          description: List of activities.
      required:
        - username
        - picture
        - phoneNumber
        - email
        - biography
        - hallOfFame
        - activity
        - id
      description: User Profile object.
    Hall of Fame:
      type: object
      properties:
        books:
          type: array
          items:
            type: string
          minItems: 0
          maxItems: 5
          uniqueItems: true
          description: List of books on the Hall of Fame.
        quote:
          type: string
          description: Quote for the Hall of Fame.
      description: Hall of Fame object.
      required:
        - books
        - quote
    Activity:
      type: object
      properties:
        id:
          type: string
          description: Activity ID.
          format: uuid
        message:
          type: string
          description: Activity Message.
      description: Activity object.
      required:
        - id
        - message
    Books Metadata:
      type: object
      properties:
        friends:
          type: array
          items:
            type: string
            format: uuid
            description: Profile ID of a friend.
          description: List of friends.
        hallOfFame:
          $ref: '#/components/schemas/Hall%20of%20Fame'
          description: Hall of Fame.
        activity:
          type: array
          items:
            $ref: '#/components/schemas/Activity'
            description: Activity.
          description: List of activities.
        biography:
          type: string
          description: Profile Biography.
      required:
        - friends
        - hallOfFame
        - activity
        - biography
      description: Books Metadata Object.
    Error Response:
      type: object
      properties:
        code:
          type: string
          description: Error code.
        message:
          type: string
          description: Error message.
        status:
          type: number
          minimum: 100
          maximum: 600
          examples:
            - 200
            - 201
            - 204
            - 304
            - 400
            - 401
            - 403
            - 405
            - 409
            - 415
            - 418
            - 500
            - 501
          description: Error status.
        owner:
          type: string
          description: Error owner.
          enum:
            - GYCODING
            - API_GATEWAY
      required:
        - code
        - message
        - status
        - owner
      description: Error Response object.
  securitySchemes: {}
servers:
  - url: https://api.gycoding.com/books
    description: Production
security: []
