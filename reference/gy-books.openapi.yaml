webhooks: {}
components:
  schemas:
    Book:
      type: object
      properties:
        id:
          type: string
          description: Book ID.
        averageRating:
          type: number
          description: Book Avergate Rating.
        userData:
          description: Book read status.
          $ref: '#/components/schemas/Book%20User%20Data'
      required:
        - id
        - averageRating
    Book User Data:
      type: object
      properties:
        profileId:
          type: string
          format: uuid
          description: User Profile ID.
        status:
          type: string
          enum:
            - WANT_TO_READ
            - READING
            - READ
          description: User status regarding this book.
        rating:
          type: number
          maximum: 5
          minimum: 0
          description: User rating for this book.
        progress:
          type: number
          description: User progress on the book.
        startDate:
          type: string
          format: date
          description: When the user has started reading this book.
        endDate:
          type: string
          format: date
          description: When the user has finished reading this book.
      required:
        - status
        - rating
        - startDate
        - endDate
        - profileId
        - progress
    Error Response:
      type: object
      properties:
        code:
          type: string
          description: Error code.
        message:
          type: string
          description: Error message.
        status:
          type: number
          minimum: 100
          maximum: 600
          examples:
            - 200
            - 201
            - 204
            - 304
            - 400
            - 401
            - 403
            - 405
            - 409
            - 415
            - 418
            - 500
            - 501
          description: Error status.
        owner:
          type: string
          description: Error owner.
          enum:
            - GYCODING
            - API_GATEWAY
      required:
        - code
        - message
        - status
        - owner
      description: Error Response object.
  securitySchemes: {}
servers:
  - url: https://api.gycoding.com/books
    description: Production
security: []
