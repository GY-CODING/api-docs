components:
  schemas:
    Book:
      type: object
      properties:
        id:
          type: string
          description: Book ID.
        averageRating:
          type: number
          description: Book Avergate Rating.
        userData:
          description: Book read status.
          $ref: '#/components/schemas/Book%20User%20Data'
      required:
        - id
        - averageRating
    Book User Data:
      type: object
      properties:
        profileId:
          type: string
          format: uuid
          description: User Profile ID.
        status:
          type: string
          enum:
            - WANT_TO_READ
            - READING
            - READ
          description: User status regarding this book.
        rating:
          type: number
          maximum: 5
          minimum: 0
          description: User rating for this book.
        progress:
          type: number
          description: User progress on the book.
        startDate:
          type: string
          format: date
          description: When the user has started reading this book.
        endDate:
          type: string
          format: date
          description: When the user has finished reading this book.
        editionId:
          type: string
          description: User favourite edition ID.
        review:
          type: string
          description: User review on the book.
      required:
        - status
        - rating
        - startDate
        - endDate
        - profileId
        - progress
        - editionId
        - review
    Friend Request:
      type: object
      properties:
        id:
          type: string
          description: Friend Request ID.
        from:
          type: string
          description: Profile ID of the user who sent the friend request.
        to:
          type: string
          description: Profile ID of the user who receives the friend request.
      description: Friend Request Object.
      required:
        - id
        - from
        - to
    User Profile:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Profile ID.
        username:
          type: string
          description: User username.
        phoneNumber:
          type: string
          description: User phone number.
          pattern: ^\+\d{1,3}\s\d{4,14}$
        picture:
          type: string
          format: uri
          description: User profile picture.
        email:
          type: string
          format: email
          description: User email.
        isFriend:
          type: boolean
          description: Whether user is friend or not of the user requesting.
        biography:
          type: string
          description: User biography for GY Books.
        hallOfFame:
          $ref: '#/components/schemas/Hall%20of%20Fame'
          description: Hall of Fame.
        activity:
          type: array
          items:
            $ref: '#/components/schemas/Activity'
            description: Activity.
          description: List of activities.
      required:
        - username
        - picture
        - phoneNumber
        - email
        - biography
        - hallOfFame
        - activity
        - id
      description: User Profile object.
    Hall of Fame:
      type: object
      properties:
        books:
          type: array
          items:
            type: string
          minItems: 0
          maxItems: 5
          uniqueItems: true
          description: List of books on the Hall of Fame.
        quote:
          type: string
          description: Quote for the Hall of Fame.
      description: Hall of Fame object.
      required:
        - books
        - quote
    Books Metadata:
      type: object
      properties:
        friends:
          type: array
          items:
            type: string
            format: uuid
            description: Profile ID of a friend.
          description: List of friends.
        hallOfFame:
          $ref: '#/components/schemas/Hall%20of%20Fame'
          description: Hall of Fame.
        activity:
          type: array
          items:
            $ref: '#/components/schemas/Activity'
            description: Activity.
          description: List of activities.
        biography:
          type: string
          description: Profile Biography.
      required:
        - friends
        - hallOfFame
        - activity
        - biography
      description: Books Metadata Object.
    Activity:
      type: object
      properties:
        id:
          type: string
          description: Activity ID.
          format: uuid
        message:
          type: string
          description: Activity Message.
        profileId:
          type: string
          format: uuid
          description: Activity Profile ID.
        likes:
          type: array
          items:
            type: string
            description: Activity Like Profile ID.
            format: uuid
          description: Activity Likes.
      description: Activity object.
      required:
        - id
    Error Response:
      type: object
      properties:
        code:
          type: string
          description: Error code.
        message:
          type: string
          description: Error message.
        status:
          type: number
          minimum: 100
          maximum: 600
          examples:
            - 200
            - 201
            - 204
            - 304
            - 400
            - 401
            - 403
            - 405
            - 409
            - 415
            - 418
            - 500
            - 501
          description: Error status.
        owner:
          type: string
          description: Error owner.
          enum:
            - GYCODING
            - API_GATEWAY
      required:
        - code
        - message
        - status
        - owner
      description: Error Response object.
  responses:
    Not Modified:
      description: ''
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error%20Response'
            description: Not Modified
          examples:
            Book Not Modified:
              summary: Book Not Modified
              value:
                code: BOOK_NOT_MODIFIED
                message: Book could not be modified.
                status: 304
                owner: GYCODING
    Bad Request:
      description: ''
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error%20Response'
            description: Bad Request
          examples:
            Bad Request:
              summary: Bad Request
              value:
                code: BAD_REQUEST
                message: The endpoint is malformed.
                status: 400
                owner: API_GATEWAY
            Hall of Fame Limit Reached:
              summary: Hall of Fame Limit Reached
              value:
                code: HALL_OF_FAME_LIMIT_REACHED
                message: >-
                  User has reached the maximum number of Hall of Fame entries
                  (5).
                status: 400
                owner: GYCODING
            Friend Request sent to self:
              summary: Friend Request sent to self
              value:
                code: FRIEND_REQUEST_TO_SELF
                message: Cannot send a friend request to oneself.
                status: 400
                owner: GYCODING
    Unauthorized:
      description: ''
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error%20Response'
            description: Unauthorized
          examples:
            Invalid Login:
              summary: Invalid Login
              value:
                code: INVALID_LOGIN
                message: >-
                  Invalid login due to the non existance of the user or invalid
                  password.
                status: 401
                owner: GYCODING
            Invalid API Key:
              summary: Invalid API Key
              value:
                code: INVALID_API_KEY
                message: The API Key is malformed.
                status: 401
                owner: API_GATEWAY
            Unauthorized to Service:
              summary: Unauthorized to Service
              value:
                code: UNAUTHORIZED
                message: The user is not authorized to access this resource.
                status: 401
                owner: GYCODING
            Invalid Token:
              summary: Invalid Token
              value:
                code: INVALID_TOKEN
                message: The provided token is invalid, expired or not even present.
                status: 401
                owner: API_GATEWAY
    Forbidden:
      description: ''
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error%20Response'
            description: Forbidden
          examples:
            Forbidden to Service:
              summary: Forbidden to Service
              value:
                code: FORBIDDEN
                message: The user has no permission to access this resource.
                status: 403
                owner: GYCODING
            Forbidden to API Gateway:
              summary: Forbidden to API Gateway
              value:
                code: FORBIDDEN
                message: The user has no permission to access this resource.
                status: 403
                owner: API_GATEWAY
    Not Found:
      description: ''
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error%20Response'
            description: Not Found
          examples:
            Token Not Found:
              summary: Token Not Found
              value:
                code: TOKEN_NOT_FOUND
                message: Authentication token was not found.
                status: 404
                owner: API_GATEWAY
            Book Not Found:
              summary: Book Not Found
              value:
                code: BOOK_NOT_FOUND
                message: Book not found.
                status: 404
                owner: GYCODING
    Method Not Allowed:
      description: ''
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error%20Response'
            description: Method Not Allowed
          examples:
            Method Not Allowed:
              summary: Method Not Allowed
              value:
                code: METHOD_NOT_ALLOWED
                message: Method used to access this resource is not allowed.
                status: 405
                owner: GYCODING
    Conflict:
      description: ''
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error%20Response'
            description: Conflict
          examples:
            Book already exists on Hall of Fame:
              summary: Book already exists on Hall of Fame
              value:
                code: HALL_OF_FAME_BOOK_ALREADY_EXISTS
                message: Book already exists in the user's Hall of Fame.
                status: 409
                owner: GYCODING
            Friend Request already exists:
              summary: Friend Request already exists
              value:
                code: FRIEND_REQUEST_ALREADY_EXISTS
                message: A friend request between these users already exists.
                status: 409
                owner: GYCODING
            Users are already friends:
              summary: Users are already friends
              value:
                code: FRIEND_REQUEST_ALREADY_FRIENDS
                message: Users are already friends.
                status: 409
                owner: GYCODING
    Internal Error:
      description: ''
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error%20Response'
            description: Internal Error
          examples:
            Database Error:
              summary: Database Error
              value:
                code: DB_ERROR
                message: >-
                  An error with the database has occurred, sorry for the
                  inconvenience.
                status: 500
                owner: GYCODING
            Auth Error from API Gateway:
              summary: Auth Error from API Gateway
              value:
                code: AUTH_ERROR
                message: >-
                  An error with the authentication service has occurred, sorry
                  for the inconvenience.
                status: 500
                owner: API_GATEWAY
            Gateway Error:
              summary: Gateway Error
              value:
                code: GATEWAY_ERROR
                message: >-
                  An internal API Gateway error has occurred, sorry for the
                  inconvenience.
                status: 500
                owner: API_GATEWAY
            Server Error:
              summary: Server Error
              value:
                code: SERVER_ERROR
                message: >-
                  An internal server error has occurred, sorry for the
                  inconvenience.
                status: 500
                owner: GYCODING
    Not Implemented:
      description: ''
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error%20Response'
            description: Not Implemented
          examples:
            Not Implemented:
              summary: Not Implemented
              value:
                code: NOT_IMPLEMENTED
                message: The resource is not implemented yet.
                status: 501
                owner: API_GATEWAY
