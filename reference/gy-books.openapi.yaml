          description: Book ID.
          required: true
          example: '382700'
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
                description: Book Data.
          headers: {}
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error%20Response'
                description: Bad Request
              examples:
                '1':
                  summary: Bad Request
                  value:
                    code: BAD_REQUEST
                    message: The endpoint is malformed.
                    status: 400
                    owner: API_GATEWAY
                '2':
                  summary: Hall of Fame Limit Reached
                  value:
                    code: HALL_OF_FAME_LIMIT_REACHED
                    message: >-
                      User has reached the maximum number of Hall of Fame
                      entries (5).
                    status: 400
                    owner: GYCODING
                '3':
                  summary: Friend Request sent to self
                  value:
                    code: FRIEND_REQUEST_TO_SELF
                    message: Cannot send a friend request to oneself.
                    status: 400
                    owner: GYCODING
          headers: {}
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error%20Response'
                description: Forbidden
              examples:
                '4':
                  summary: Forbidden to Service
                  value:
                    code: FORBIDDEN
                    message: The user has no permission to access this resource.
                    status: 403
                    owner: GYCODING
                '5':
                  summary: Forbidden to API Gateway
                  value:
                    code: FORBIDDEN
                    message: The user has no permission to access this resource.
                    status: 403
                    owner: API_GATEWAY
          headers: {}
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error%20Response'
                description: Not Found
              examples:
                '6':
                  summary: Token Not Found
                  value:
                    code: TOKEN_NOT_FOUND
                    message: Authentication token was not found.
                    status: 404
                    owner: API_GATEWAY
                '7':
                  summary: Book Not Found
