  /{profileId}/list:
    get:
      summary: List Books by User
      deprecated: false
      description: >-
        Lists all books marked by the user, aside from the state marked. This
        resource is paginated.
      tags:
        - Books
      parameters:
        - name: profileId
          in: path
          description: Profile ID.
          required: true
          example: 93dcc507-c706-4ed9-841f-fe470bdbb7d6
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          description: Page of the list.
          required: true
          example: 1
          schema:
            type: number
        - name: size
          in: query
          description: Page size.
          required: true
          example: 10
          schema:
            type: number
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
