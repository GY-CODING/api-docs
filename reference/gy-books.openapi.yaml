components:
  schemas:
    Book:
      type: object
      properties:
        id:
          type: string
          description: Book ID.
        title:
          type: string
          description: Book Title.
        cover:
          type: string
          description: Book Cover.
          format: uri
        author:
          type: string
          description: Book Author.
        series:
          description: Book Series.
          $ref: '#/components/schemas/Series'
        averageRating:
          type: number
          description: Book Avergate Rating.
        publishDate:
          type: string
          description: Book Publish Date.
          format: date
        pageCount:
          type: number
          description: Book Number of Pages.
      required:
        - id
        - title
        - cover
        - author
        - publishDate
        - pageCount
        - averageRating
    Author:
      type: object
      properties:
        id:
          type: string
          description: Author ID.
          format: uuid
        name:
          type: string
          description: Author Name.
        selfLink:
          type: string
          format: uri
          description: Author Self Link
      required:
        - id
        - name
        - selfLink
    Series:
      type: object
      properties:
        id:
          type: string
          description: Series ID.
          format: uuid
        name:
          type: string
          description: Series Name.
        selfLink:
          type: string
          format: uri
          description: Series Self URL.
      required:
        - id
        - name
        - selfLink
    Rating:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Rating ID.
        bookId:
          type: string
          description: Book ID.
        rating:
          type: number
          description: Book Rating ID.
        startDate:
          type: string
          format: date
          description: Book Rating Start Date.
        endDate:
          type: string
          format: date
          description: Book Rating End Date.
      required:
        - id
        - bookId
        - rating
        - startDate
        - endDate
      description: Rating Object.
  securitySchemes: {}
servers:
  - url: https://api.gycoding.com/books
    description: Production
security: []
