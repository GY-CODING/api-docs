components:
  responses:
    BadRequestAPIErrorResponse:
      description: 400 response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            BadRequestResponse:
              $ref: '#/components/examples/BadRequestAPIErrorResponseExample'
    UnauthorizedAPIErrorResponse:
      description: 401 response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            UnauthorizedServiceResponse:
              $ref: '#/components/examples/UnauthorizedServiceAPIErrorResponseExample'
            UnauthorizedGatewayResponse:
              $ref: '#/components/examples/UnauthorizedGatewayAPIErrorResponseExample'
    ForbiddenAPIErrorResponse:
      description: 403 response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            ForbiddenServiceResponse:
              $ref: '#/components/examples/ForbiddenServiceAPIErrorResponseExample'
            ForbiddenGatewayResponse:
              $ref: '#/components/examples/ForbiddenGatewayAPIErrorResponseExample'
    ResourceNotFoundAPIErrorResponse:
      description: 404 response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            ResourceNotFoundResponse:
              $ref: '#/components/examples/ResourceNotFoundAPIErrorResponseExample'
    TokenNotFoundAPIErrorResponse:
      description: 404 response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            TokenNotFoundResponse:
              $ref: '#/components/examples/TokenNotFoundAPIErrorResponseExample'
    MethodNotAllowedAPIErrorResponse:
      description: 405 response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            MethodNotAllowedResponse:
              $ref: '#/components/examples/MethodNotAllowedAPIErrorResponseExample'
    ConflictAPIErrorResponse:
      description: 409 response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            ConflictResponse:
              $ref: '#/components/examples/ConflictAPIErrorResponseExample'
    DBErrorResponse:
      description: 500 response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            DBErrorResponse:
              $ref: '#/components/examples/DBErrorResponseExample'
    AuthErrorResponse:
      description: 500 response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            AuthErrorResponse:
              $ref: '#/components/examples/AuthErrorResponseExample'
    GatewayErrorResponse:
      description: 500 response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            GatewayErrorResponse:
              $ref: '#/components/examples/GatewayErrorResponseExample'
    ServerErrorResponse:
      description: 500 response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            ServerErrorResponse:
              $ref: '#/components/examples/ServerErrorResponseExample'
              
  examples:
    ResourceNotModifiedAPIErrorResponseExample:
      value:
        code: RESOURCE_NOT_MODIFIED
        message: The resource could not be modified due to some internal conflict or error.
        status: 304
        owner: GYCODING
    BadRequestAPIErrorResponseExample:
      value:
        code: BAD_REQUEST
        message: The endpoint is malformed.
        status: 400
        owner: API_GATEWAY
    InvalidLoginAPIErrorResponseExample:
      value:
        code: INVALID_LOGIN
        message: Invalid login due to the non existance of the user or invalid password.
        status: 401
        owner: GYCODING
    UnauthorizedServiceAPIErrorResponseExample:
      value:
        code: UNAUTHORIZED
        message: The user is not authorized to access this resource.
        status: 401
        owner: API_GATEWAY
    UnauthorizedGatewayAPIErrorResponseExample:
      value:
        code: UNAUTHORIZED
        message: The user is not authorized to access this resource.
        status: 401
        owner: API_GATEWAY
    ForbiddenServiceAPIErrorResponseExample:
      value:
        code: FORBIDDEN
        message: The user has no permission to access this resource.
        status: 403
        owner: GYCODING
    ForbiddenGatewayAPIErrorResponseExample:
      value:
        code: FORBIDDEN
        message: The user has no permission to access this resource.
        status: 403
        owner: API_GATEWAY
    ResourceNotFoundAPIErrorResponseExample:
      value:
        code: RESOURCE_NOT_FOUND
        message: This resource was not found.
        status: 404
        owner: GYCODING
    TokenNotFoundAPIErrorResponseExample:
      value:
        code: TOKEN_NOT_FOUND
        message: Authentication token was not found.
        status: 404
        owner: API_GATEWAY
    MethodNotAllowedAPIErrorResponseExample:
      value:
        code: METHOD_NOT_ALLOWED
        message: Method used to access this resource is not allowed.
        status: 405
        owner: GYCODING
    ConflictAPIErrorResponseExample:
      value:
        code: CONFLICT
        message: An internal conflict between external data and the API has occured. Requested data may already exist.
        status: 409
        owner: GYCODING
    InvalidSignUpAPIErrorResponseExample:
      value:
        code: INVALID_SIGN_UP
        message: Invalid sign up due to the already existance of the user or an authentication error.
        status: 409
        owner: GYCODING
    DBErrorResponseExample:
      value:
        code: DB_ERROR
        message: An error with the database has occurred, sorry for the inconvenience.
        status: 500
        owner: GYCODING
    AuthErrorResponseExample:
      value:
        code: AUTH_ERROR
        message: An error with the authentication service has occurred, sorry for the inconvenience.
        status: 500
        owner: 
          oneOf:
            - GYCODING
            - API_GATEWAY
    GatewayErrorResponseExample:
      value:
        code: GATEWAY_ERROR
        message: An internal API Gateway error has occurred, sorry for the inconvenience.
        status: 500
        owner: API_GATEWAY
    ServerErrorResponseExample:
      value:
        code: SERVER_ERROR
        message: An internal server error has occurred, sorry for the inconvenience.
        status: 500
        owner: GYCODING
    
  schemas:
    ApiError:
      description: Model for error responses.
      type: object
      properties:
        code:
          type: string
          description: Internal error code.
        message:
          type: string
          description: Error message summary.
        status:
          type: integer
          description: HTTP status error code.
          enum:
            - 400
            - 401
            - 403
            - 404
            - 405
            - 409
            - 500
        owner:
          type: string
          description: Error owner could be GYCODING or API_GATEWAY.
          enum:
            - GYCODING
            - API_GATEWAY