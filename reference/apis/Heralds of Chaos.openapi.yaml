components:
  schemas:
    Item:
      type: object
      properties:
        identifier:
          type: string
          description: Item identifier.
        name:
          type: string
          description: Item name.
        description:
          type: string
          description: Item description.
        image:
          type: string
          format: uri
          description: Item image.
        inGame:
          type: boolean
          default: false
          description: Whether the item is on the game or not.
        type:
          type: string
          enum:
            - COMPLETE_ITEM
            - FRAGMENT
            - UNKNOWN
          description: Item type.
        fragments:
          type: array
          items: *ref_2
          maxItems: 2
          description: >-
