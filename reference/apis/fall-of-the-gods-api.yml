openapi: 3.1.0
info:
  title: Fall of the Gods API
  description: API REST that provides all the information available about Fall of the Gods universe.
  version: 4.1.0
servers:
  - url: 'https://api.gycoding.com/fallofthegods'
    description: Production Server

