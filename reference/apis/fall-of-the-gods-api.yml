components:
  parameters:
    Id:
      name: id
      in: query
      required: true
      schema:
        type: string
      description: Entity identifier.
    Page:
      name: page
      in: query
      required: true
      schema:
        type: number
      description: Number of page of a paginated list of entities.
    Size:
      name: size
      in: query
      required: true
      schema:
        type: number
      description: Amount of elements to show on one page.
    Lang:
      name: lang
      in: query
      required: false
      schema:
        type: string
        enum:
          - en
          - es
      description: The language of the chat.