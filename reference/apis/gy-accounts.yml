# ====================================================================== #

components:
  parameters:
    Authorization:
      name: Authorization
      in: header
      required: true
      schema:
        type: string
      description: Authentication token.
      example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c'
    UserID:
      name: user-id
      in: path
      required: true
      schema:
        type: string
      description: User ID provided by the authorization service for each specific user.
    ChatID:
      name: chat-id
      in: query
      required: true
      schema:
        type: string
      description: Chat ID.

  schemas:
    ChatMetadata:
      type: object
      properties:
        chatId:
          type: string
