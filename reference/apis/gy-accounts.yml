openapi: 3.1.0
info:
  title: GY Accounts
  description: Official GYCODING account management API service.
  version: 3.2.0
servers:
  - url: 'https://api.gycoding.com/accounts'
    description: Production Server

# ====================================================================== #
# ====================================================================== #

paths:
  /auth/login:
    post:
      summary: Login
      description: Checks the existence and authentication of a user account using basic Email/Username and Password authentication and returns a JWT.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          $ref: '../shared/responses.yml#/components/responses/OKResponse'
        '400':
          $ref: '../shared/errors.yml#/components/responses/BadRequestAPIErrorResponse'
        '401':
          $ref: '../shared/errors.yml#/components/responses/UnauthorizedAPIErrorResponse'
        '405':
          $ref: '../shared/errors.yml#/components/responses/MethodNotAllowedAPIErrorResponse'
        '500':
          oneOf:
            - $ref: '../shared/errors.yml#/components/responses/ServerErrorResponse'
            - $ref: '../shared/errors.yml#/components/responses/AuthErrorResponse'
      x-roles:
        - COMMON
        - ADMIN

  /auth/signup:
    post:
      summary: Sign Up
      description: Registers a new user account using basic Email/Username and Password authentication.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        '200':
