components:
  schemas:
    Group Chat:
      type: object
      properties:
        chatId:
          type: string
          format: uuid
          description: Chat ID.
        name:
          type: string
          description: Chat name.
        creator:
          type: string
          description: Chat Creator User ID.
          format: uuid
        owner:
          type: string
          description: Chat Owner User ID.
          format: uuid
        members:
          type: array
          items:
            description: Chat Member object.
            $ref: '#/components/schemas/Member'
          description: Chat members.
        messages:
          type: array
          items: &ref_2
            description: Chat Message object.
            $ref: '#/components/schemas/Message'
          description: Chat messages.
      required:
        - chatId
        - members
        - name
        - creator
        - owner
        - messages
      description: Chat object.
    Member:
      type: object
      properties:
        userId:
          type: string
          description: Member User ID.
        isAdmin:
          type: boolean
          description: Whether the Member is admin or not of the chat.
      required:
        - userId
        - isAdmin
      description: Member object.
    Private Chat:
      type: object
      properties:
        chatId:
          type: string
          format: uuid
          description: Chat ID.
        messages:
          type: array
          items: *ref_2
          description: Chat messages.
      required:
        - chatId
        - messages
      description: Chat object.
    Error Response:
      type: object
      properties:
        code:
          type: string
          description: Error code.
        message:
          type: string
          description: Error message.
        status:
          type: integer
          minimum: 100
          maximum: 600
          examples:
            - 200
            - 201
            - 204
            - 304
            - 400
            - 401
            - 403
            - 405
            - 409
            - 415
            - 418
            - 500
            - 501
          description: Error HTTP status.
        owner:
          type: string
          enum:
            - GYCODING
            - API_GATEWAY
          description: Error owner.
      required:
        - code
        - message
        - status
        - owner
      description: Error Response object.
    Message:
      type: object
      properties:
        author:
          type: string
          description: Message Author User ID.
        content:
          type: string
          description: Message content.
        date:
          type: string
          format: date-time
          description: Message date.
        state:
          type: string
          enum:
            - PREPARED
            - SENT
            - RECEIVED
            - READ
          description: Message state.
      required:
        - author
        - content
        - date
        - state
      description: Message object.
  securitySchemes: {}
servers:
  - url: https://api.gycoding.com/messages
    description: Production
security: []
