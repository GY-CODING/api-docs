paths:
  /auth/login:
    post:
      summary: Login
      deprecated: false
      description: >-
        Checks the existance and the authentication of an user account basic
        Email/Username and Password authentication and returns their
        credentials.
      tags:
        - Authentication
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              description: User credentials object.
              type: object
              properties:
                email:
                  type: string
                  description: User email.
                  format: email
                password:
                  type: string
                  description: User password.
                  format: password
              required:
                - password
            example:
              email: test@gycoding.com
              password: testtest_0
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Login%20Response'
                description: Logged User Credentials.
          headers: {}
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error%20Response'
              example:
                code: BAD_REQUEST
                message: The endpoint is malformed.
                status: 400
                owner: API_GATEWAY
          headers: {}
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error%20Response'
          headers: {}
        '405':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error%20Response'
              example:
                code: METHOD_NOT_ALLOWED
                message: Method used to access this resource is not allowed.
                status: 405
                owner: GYCODING
          headers: {}
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error%20Response'
              examples:
                '2':
                  summary: Database Error
                  value:
                    code: DB_ERROR
                    message: >-
                      An error with the database has occurred, sorry for the
                      inconvenience.
                    status: 500
                    owner: GYCODING
                '3':
                  summary: Auth Error from Service
                  value:
                    code: AUTH_ERROR
                    message: >-
                      An error with the authentication service has occurred,
                      sorry for the inconvenience.
                    status: 500
                    owner: GYCODING
                '4':
                  summary: Auth Error from API Gateway
                  value:
                    code: AUTH_ERROR
                    message: >-
                      An error with the authentication service has occurred,
                      sorry for the inconvenience.
                    status: 500
                    owner: API_GATEWAY
                '5':
                  summary: Gateway Error
                  value:
                    code: GATEWAY_ERROR
                    message: >-
                      An internal API Gateway error has occurred, sorry for the
                      inconvenience.
                    status: 500
                    owner: API_GATEWAY
                '6':
                  summary: Server Error
                  value:
                    code: SERVER_ERROR
                    message: >-
                      An internal server error has occurred, sorry for the
                      inconvenience.
                    status: 500
                    owner: GYCODING
          headers: {}
      security: []
      x-roles:
        - COMMON
        - ADMIN
        - DEVELOPER
