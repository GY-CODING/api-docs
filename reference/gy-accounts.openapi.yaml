components:
  schemas:
    Login Response:
      type: object
      properties:
        access_token:
          type: string
          description: Acess Token.
        id_token:
          type: string
          description: JSON Web Token.
        token_type:
          type: string
          description: Token type.
          enum:
            - Bearer
        expires_in:
          type: integer
          description: Expiration time of the token.
      required:
        - access_token
        - id_token
        - token_type
        - expires_in
      description: Login credentials object.
    Sign Up Response:
      type: object
      properties:
        username:
          type: string
          description: User username.
        email:
          type: string
          description: User email.
        phone_number:
          type: string
          description: User phone number.
      required:
        - username
        - email
        - phone_number
      description: User Sign Up Response object.
    User Credentials:
      type: object
      properties:
        username:
          type: string
          description: User username.
        email:
          type: string
          description: User email.
          format: email
        password:
          type: string
          description: User password.
          format: password
      required:
        - password
      description: User credentials object.
    User Profile:
      type: object
      properties:
        username:
          type: string
          description: User username.
        phoneNumber:
          type: string
          description: User phone number.
        roles:
          type: array
          items:
            type: string
            enum:
              - COMMON
              - ADMIN
            default: COMMON
          description: User roles.
        picture:
          type: string
          format: uri
          description: User profile picture.
      required:
        - username
        - picture
        - phoneNumber
      description: User Profile object.
    GY Messages Metadata:
      type: object
      properties:
        chats:
          type: array
          items: *ref_1
          description: Chats where the user belong.
      required:
        - chats
      description: User GY Messages Metadata object.
    GY Messages Chat Metadata:
      type: object
      properties:
        chatId:
          type: string
          format: uuid
          description: Chat ID.
        isAdmin:
          type: boolean
          description: Whether the user is admin or not of the chat.
      required:
        - chatId
        - isAdmin
      description: User GY Messages Chat Metadata object.
    User Metadata:
      type: object
      properties:
        gyMessages:
          $ref: '#/components/schemas/GY%20Messages%20Metadata'
          description: User GY Messages Metadata object.
        profile: *ref_2
      required:
        - gyMessages
