            application/json:
              schema:
                $ref: '#/components/schemas/Error%20Response'
              example:
                code: METHOD_NOT_ALLOWED
                message: Method used to access this resource is not allowed.
                status: 405
                owner: GYCODING
          headers: {}
        '409':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error%20Response'
              examples:
                '2':
                  summary: Conflict
                  value:
                    code: CONFLICT
                    message: >-
                      An internal conflict between external data and the API has
                      occured. Requested data may already exist.
                    status: 409
                    owner: GYCODING
                '3':
                  summary: Invalid Sign Up
                  value:
                    code: INVALID_SIGN_UP
                    message: >-
                      Invalid sign up due to the already existance of the user
                      or an authentication error.
                    status: 409
                    owner: GYCODING
          headers: {}
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error%20Response'
              examples:
                '4':
                  summary: Database Error
                  value:
                    code: DB_ERROR
                    message: >-
                      An error with the database has occurred, sorry for the
                      inconvenience.
                    status: 500
                    owner: GYCODING
                '5':
                  summary: Auth Error from Service
                  value:
                    code: AUTH_ERROR
                    message: >-
                      An error with the authentication service has occurred,
                      sorry for the inconvenience.
                    status: 500
                    owner: GYCODING
                '6':
                  summary: Auth Error from API Gateway
