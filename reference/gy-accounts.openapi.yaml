                    status: 500
                    owner: API_GATEWAY
                '7':
                  summary: Gateway Error
                  value:
                    code: GATEWAY_ERROR
                    message: >-
                      An internal API Gateway error has occurred, sorry for the
                      inconvenience.
                    status: 500
                    owner: API_GATEWAY
                '8':
                  summary: Server Error
                  value:
                    code: SERVER_ERROR
                    message: >-
                      An internal server error has occurred, sorry for the
                      inconvenience.
                    status: 500
                    owner: GYCODING
          headers: {}
      security: []
      x-roles:
        - COMMON
        - ADMIN
