paths:
  /characters/{id}:
    get:
      summary: Get Character
      deprecated: false
      description: >-
        Retrieves a specific character from the whole universe of Heralds of
        Chaos.
      tags:
        - Characters
      parameters:
        - name: id
          in: path
          description: Character's identifier.
          required: true
          example: odin
          schema:
            type: string
        - name: lang
          in: query
          description: Language of the response.
          required: true
          example: es
          schema:
            type: string
            enum:
              - es
              - en
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Character'
                description: Character object.
          headers: {}
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error%20Response'
              example:
                code: BAD_REQUEST
                message: The endpoint is malformed.
                status: 400
                owner: API_GATEWAY
          headers: {}
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error%20Response'
              examples:
                '2':
                  summary: Forbidden to Service
                  value:
                    code: FORBIDDEN
                    message: The user has no permission to access this resource.
                    status: 403
                    owner: GYCODING
                '3':
                  summary: Forbidden to API Gateway
                  value:
                    code: FORBIDDEN
                    message: The user has no permission to access this resource.
                    status: 403
                    owner: API_GATEWAY
          headers: {}
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error%20Response'
              examples:
                '4':
                  summary: Token Not Found
                  value:
                    code: TOKEN_NOT_FOUND
                    message: Authentication token was not found.
                    status: 404
                    owner: API_GATEWAY
                '5':
                  summary: Resource Not Found
                  value:
                    code: RESOURCE_NOT_FOUND
                    message: This resource was not found.
                    status: 404
                    owner: GYCODING
          headers: {}
        '405':
          description: ''
          content:
            application/json:
