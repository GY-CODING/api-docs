components:
  schemas:
    Item:
      type: object
      properties:
        identifier:
          type: string
          description: Item identifier.
        name:
          type: string
          description: Item name.
        description:
          type: string
          description: Item description.
        image:
          type: string
          format: uri
          description: Item image.
        type:
          type: string
          enum:
            - COMPLETE_ITEM
            - FRAGMENT
            - UNKNOWN
          description: Item type.
      required:
        - identifier
        - name
        - description
        - image
        - type
      description: Item object.
    Character:
      type: object
      properties:
        identifier:
          type: string
          description: Character identifier.
        name:
          type: string
          description: Character name.
        title:
          type: string
          description: Character title.
        description:
          type: string
          description: Character description.
        race:
          type: string
          description: Character race.
          enum:
            - Æsir
            - Valkyria
            - Elfo de Luz
            - Elfo Oscuro
            - Vanir
            - Humano
            - Vegar
            - Nibelungo
            - Gigante de Hielo
            - Gigante de Fuego
            - Entidad Primigenia
