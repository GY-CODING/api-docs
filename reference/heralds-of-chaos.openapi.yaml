components:
  schemas:
    Item:
      type: object
      properties:
        identifier:
          type: string
          description: Item identifier.
        name:
          type: string
          description: Item name.
        description:
          type: string
          description: Item description.
        image:
          type: string
          format: uri
          description: Item image.
        inGame:
          type: boolean
          default: false
          description: Whether the item is on the game or not.
        type:
          type: string
          enum:
            - COMPLETE_ITEM
            - FRAGMENT
            - UNKNOWN
          description: Item type.
      required:
        - identifier
        - name
        - description
        - image
        - inGame
        - type
      description: Item object.
    Character:
      type: object
      properties:
        identifier:
          type: string
          description: Character identifier.
        name:
          type: string
          description: Character name.
        title:
          type: string
          description: Character title.
        description:
          type: string
          description: Character description.
        race:
          type: string
          description: Character race.
          enum:
            - Æsir
            - Valkyria
            - Elfo de Luz
            - Elfo Oscuro
            - Vanir
            - Humano
            - Vegar
            - Nibelungo
            - Gigante de Hielo
            - Gigante de Fuego
            - Entidad Primigenia
            - Desconocida
        image:
          type: string
          format: uri
          description: Character image.
        inGame:
          type: boolean
          description: Whether the character is on the game or not.
          default: false
        world: *ref_3
      required:
        - name
        - identifier
        - description
        - title
        - image
        - inGame
        - world
        - race
      description: Character object.
    World:
      type: object
      properties:
        identifier:
          type: string
          description: World identifier.
        name:
          type: string
          description: World name.
        description:
          type: string
          description: World description.
        places:
          type: array
          items: *ref_4
          description: World places.
        image:
          type: string
          format: uri
          description: World image.
        detailedIcon:
          type: string
          format: uri
          description: World icon.
      required:
        - identifier
        - name
        - description
        - places
        - image
        - detailedIcon
      description: World object.
    Place:
      type: object
      properties:
        identifier:
          type: string
          description: Place identifier.
        name:
          type: string
          description: Place name.
        description:
          type: string
          description: Place description.
        image:
          type: string
          format: uri
          description: Place image.
        inGame:
          type: boolean
          description: Whether the place is on the game or not.
          default: false
      required:
        - identifier
        - name
        - description
        - image
        - inGame
      description: Place object.
    Creature:
      type: object
      properties:
        identifier:
          type: string
          description: Creature identifier.
        name:
          type: string
          description: Creature name.
        description:
          type: string
          description: Creature description.
        image:
          type: string
          format: uri
          description: Creature image.
        inGame:
          type: boolean
          description: Whether the creature is on the game or not.
      required:
        - identifier
        - name
        - description
        - image
        - inGame
      description: Creature object.
    Achievement:
      type: object
      properties:
        identifier:
          type: string
          description: Achievement identifier.
        name:
          type: string
          description: Achievement name.
        description:
          type: string
          description: Achievement description.
        image:
          type: string
          description: Achievement image.
          format: uri
        tier:
          type: string
          description: Achievement tier.
          enum:
            - BRONZE
            - SILVER
            - GOLD
            - PLATINUM
        origin:
          type: string
          description: Achievement origin.
          enum:
            - HERALDS_OF_CHAOS
      required:
        - identifier
